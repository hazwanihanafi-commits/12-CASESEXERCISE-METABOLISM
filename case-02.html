{title:'Meet the Patient & CES Student',sub:'Can I exercise safely after a heart attack?',html:()=>`<img class="art" src="${patientImage}" alt="Cardiac rehabilitation patient speaking to CES student, with patient background and learning goals"><div class="panel pink"><h3>💬 Your turn</h3><p>How would you respond to this patient, including the importance of medical clearance?</p><textarea id="initial" placeholder="Write your answer here..."></textarea></div>`},
{title:'What Happens Inside the Body?',sub:'Three cardiovascular adaptations to appropriately prescribed exercise',html:()=>`<img class="art" src="${physiologyImage}" alt="Three medical illustrations of the heart, blood vessel function and autonomic regulation"><div class="panel"><h3>1 · Cardiovascular function</h3><p>With suitable, progressive training, exercise stroke volume and functional capacity can improve. Changes depend on the patient's condition, medication and rehabilitation stage.</p></div><div class="panel gold"><h3>2 · Endothelial function</h3><p>Repeated exercise can improve nitric-oxide-mediated vasodilation and blood vessel function, supporting circulation during activity.</p></div><div class="panel green"><h3>3 · Autonomic regulation</h3><p>Over time, training may improve autonomic balance and heart-rate recovery. Beta-blockers can alter heart-rate responses, so heart rate alone may not be a reliable intensity guide.</p></div>`},
{title:'Key Takeaways & CES Physiology',sub:'Explain the science accurately and safely',html:()=>`<div class="two"><div class="panel green"><h3>✓ What the patient should know</h3><ul><li>Exercise can help rebuild confidence and functional fitness.</li><li>Start within an approved cardiac rehabilitation programme.</li><li>Progress gradually with appropriate monitoring.</li><li>Stop and seek assessment for concerning symptoms.</li></ul></div><div class="panel lilac"><h3>🔬 What the CES student should know</h3><ul><li>Stroke volume and cardiac output</li><li>Peripheral oxygen delivery and endothelial function</li><li>Autonomic adaptations</li><li>Effects of beta-blockers on heart rate</li></ul></div></div><div class="panel gold"><h3>⚠️ Safety</h3><p>Chest pain, marked breathlessness, dizziness, fainting or new palpitations warrant stopping exercise and seeking prompt clinical evaluation. A recent myocardial infarction requires individual medical clearance.</p></div>`},
{title:'Interactive Rehabilitation Simulator',sub:'Explore relative exercise workload — not a medical prescription',html:()=>`<div class="panel"><h3>Choose an example activity</h3><label class="choice"><input type="radio" name="activity" value="Walking" checked> 🚶 Walking</label><label class="choice"><input type="radio" name="activity" value="Stationary cycling"> 🚴 Stationary cycling</label></div><div class="panel"><label for="duration"><b>Duration: <span id="mins">15</span> minutes</b></label><input id="duration" type="range" min="5" max="40" step="5" value="15"><label for="intensity"><b>Perceived exertion: <span id="effort">Light</span></b></label><input id="intensity" type="range" min="1" max="3" value="1"></div><div class="panel green" aria-live="polite"><h3 id="demand">Relative demand</h3><p id="explain"></p></div><div class="panel gold"><b>Clinical note:</b> This tool cannot determine safe intensity or predict blood pressure, heart rate or cardiac events. Follow the treating team's programme and monitoring guidance.</div>`},
{title:'Knowledge Challenge',sub:'Three questions with immediate explanations',html:()=>`<div class="panel"><h3>1. Why is medical clearance important after myocardial infarction?</h3><label class="choice"><input type="radio" name="q1" value="a"> Everyone can immediately return to vigorous exercise</label><label class="choice"><input type="radio" name="q1" value="b"> Exercise needs individual risk assessment and progression</label><label class="choice"><input type="radio" name="q1" value="c"> Exercise is always prohibited</label></div><div class="panel"><h3>2. Which adaptation can result from appropriate training?</h3><label class="choice"><input type="radio" name="q2" value="a"> Improved endothelial function</label><label class="choice"><input type="radio" name="q2" value="b"> Guaranteed normal cardiac function</label><label class="choice"><input type="radio" name="q2" value="c"> Elimination of all cardiac risk</label></div><div class="panel"><h3>3. Why is heart rate alone sometimes insufficient for intensity monitoring?</h3><label class="choice"><input type="radio" name="q3" value="a"> Heart rate never changes with exercise</label><label class="choice"><input type="radio" name="q3" value="b"> All patients have the same maximum heart rate</label><label class="choice"><input type="radio" name="q3" value="c"> Beta-blockers can blunt the heart-rate response</label></div><button class="btn primary" id="check">Check answers ✓</button><div id="feedback" aria-live="polite"></div>`},
{title:'Key Facts & Reflection',sub:'Apply what you learned in a safe patient conversation',html:()=>`<div class="panel"><h3>📘 Key facts</h3><ul><li>Cardiac rehabilitation combines medical assessment, supervised exercise and education.</li><li>Training can improve functional capacity and vascular health.</li><li>Medication can influence heart-rate responses.</li><li>Warning symptoms must never be ignored.</li></ul></div><div class="panel lilac"><h3>✍️ Your reflection</h3><p>Explain to the patient why supervised exercise can help after a heart attack. Include two safety considerations.</p><textarea id="reflection" placeholder="Write your patient-friendly explanation..."></textarea></div><button class="btn primary" id="download">Download learning record ↓</button>`}
];
function render(){const c=cards[page];document.getElementById('title').textContent=c.title;document.getElementById('subtitle').textContent=c.sub;document.getElementById('content').innerHTML=c.html();document.getElementById('position').textContent='Card '+(page+1)+' of 6';document.getElementById('count').textContent=(page+1)+' / 6';document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===5?'Complete case ✓':'Next card →';document.getElementById('tabs').innerHTML=names.map((n,i)=>`<button data-index="${i}" class="${i===page?'active':''}" ${i===page?'aria-current="step"':''}>${i+1} · ${n}</button>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.index))));for(const id of ['initial','reflection']){const el=document.getElementById(id);if(el){el.value=load(id);el.addEventListener('input',()=>save(id,el.value))}}if(page===3)sim();if(page===4)quiz();if(page===5)document.getElementById('download').addEventListener('click',download)}
function go(i){page=Math.max(0,Math.min(5,i));save('page',String(page));render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('prev').addEventListener('click',()=>go(page-1));document.getElementById('next').addEventListener('click',()=>page===5?alert('Case complete! Download your learning record to keep your answers.'):go(page+1));
function sim(){const d=document.getElementById('duration'),v=document.getElementById('intensity');try{const s=JSON.parse(load('sim'));if(s){d.value=s.duration;v.value=s.intensity;const x=document.querySelector(`input[name="activity"][value="${s.activity}"]`);if(x)x.checked=true}}catch(e){}function change(){const m=Number(d.value),level=Number(v.value),act=document.querySelector('input[name="activity"]:checked').value;document.getElementById('mins').textContent=m;document.getElementById('effort').textContent=['','Light','Moderate','Hard'][level];document.getElementById('demand').textContent='Illustrative relative workload: '+(m*level<30?'Lower':m*level<75?'Moderate':'Higher');document.getElementById('explain').textContent=`${act} for ${m} minutes at ${['','light','moderate','hard'][level]} perceived effort. Greater duration and exertion generally increase total physiological demand. This does not establish safety for this patient.`;save('sim',JSON.stringify({duration:m,intensity:level,activity:act}))}[d,v,...document.querySelectorAll('input[name="activity"]')].forEach(el=>el.addEventListener('input',change));change()}
function quiz(){document.getElementById('check').addEventListener('click',()=>{const correct=['b','a','c'];let score=0;correct.forEach((a,i)=>{const el=document.querySelector(`input[name="q${i+1}"]:checked`);if(el&&el.value===a)score++});save('score',score+'/3');document.getElementById('feedback').innerHTML=`<div class="status"><b>Score: ${score}/3</b><p>1. Exercise requires individual risk assessment. 2. Endothelial function may improve with appropriate training. 3. Beta-blockers can blunt heart-rate responses.</p></div>`})}
function download(){const t=['TCE504 Cardiac Rehabilitation','Initial answer: '+load('initial'),'Simulator: '+load('sim'),'Quiz score: '+load('score'),'Reflection: '+load('reflection')].join('\n\n');const u=URL.createObjectURL(new Blob([t],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download='TCE504_Cardiac_Rehabilitation_Record.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}render();
</script></body></html>
